name: Find candidate resources for empty topics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/empty_topics.tsv", "scripts/find_candidates.py"]
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/find_candidates.py
      - run: |
          git config user.name "inventory-bot"; git config user.email "inventory-bot@users.noreply.github.com"
          git add data/candidates.json
          git diff --cached --quiet || git commit -m "data: candidate resources for empty topics"
          git pull --rebase origin main && git push
