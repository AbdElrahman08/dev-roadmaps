<title>Darb Learning Paths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free tech courses from universities and trusted providers, organised into 93 learning paths and checked every week.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a study atlas. Sticky top bar; each view is a column of bands. Paths read as routes (stage numbers are real order); the catalog is a filterable list. Logical properties throughout so Arabic mirrors cleanly. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --sunk:#e8eef0; --ink:#102027; --muted:#53646c; --line:#d3dde1;
  --nile:#0b5671; --nile-ink:#ffffff; --nile-soft:#dcecf2; --saffron:#a8700a; --saffron-soft:#f8ecd2;
  --ok:#1d7a43; --ok-soft:#dff1e6; --warn:#8a5a00; --warn-soft:#f7ecd4;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --arabic-display:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --arabic-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1417; --surface:#131e22; --sunk:#0f191c; --ink:#e3ecef; --muted:#9aacb3; --line:#25353b;
  --nile:#5cb8d6; --nile-ink:#06161c; --nile-soft:#14313b; --saffron:#e8b24a; --saffron-soft:#33280f;
  --ok:#78d39b; --ok-soft:#163222; --warn:#e9bf6a; --warn-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1417; --surface:#131e22; --sunk:#0f191c; --ink:#e3ecef; --muted:#9aacb3; --line:#25353b;
  --nile:#5cb8d6; --nile-ink:#06161c; --nile-soft:#14313b; --saffron:#e8b24a; --saffron-soft:#33280f;
  --ok:#78d39b; --ok-soft:#163222; --warn:#e9bf6a; --warn-soft:#33290f; color-scheme:dark}
:root[lang="ar"]{--display:var(--arabic-display);--body:var(--arabic-body)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);margin:0}
:root[lang="ar"] body{line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--nile)}
:focus-visible{outline:2px solid var(--nile);outline-offset:2px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:40;background:var(--nile);color:var(--nile-ink);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:12px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5.4vw,56px);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(23px,3vw,31px);font-weight:700;letter-spacing:-.01em}
h3{font-size:19px;font-weight:600}
:root[lang="ar"] h1,:root[lang="ar"] h2{letter-spacing:0}
:root[lang="ar"] h1{font-size:clamp(28px,4.6vw,48px);line-height:1.35}
p{margin:0}
.lede{font-size:19px;color:var(--muted);max-width:62ch}
.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .eyebrow{font-family:var(--body);font-size:14px;letter-spacing:0}
.arr{display:inline-block}
[dir="rtl"] .arr{transform:scaleX(-1)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand b{font:700 22px/1 "Familjen Grotesk",system-ui,sans-serif;letter-spacing:-.01em}
.brand .ar{font:700 18px/1 var(--arabic-display);color:var(--saffron)}
.nav{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.nav a{font:600 15px/1 var(--body);color:var(--ink);text-decoration:none;padding:9px 11px;border-radius:8px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--nile-soft);color:var(--nile)}
.lang{font:600 14px/1 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);padding:8px 11px;border-radius:8px;cursor:pointer;text-decoration:none}
.lang:hover{border-color:var(--nile);color:var(--nile)}
.menu-btn{display:none;font:600 15px var(--body);background:var(--sunk);border:0;color:var(--ink);padding:9px 12px;border-radius:8px}
@media (max-width:860px){.menu-btn{display:block}.nav{display:none;width:100%;flex-direction:column;align-items:stretch}.nav.open{display:flex}.nav a{padding:12px}.nav .lang{margin-top:6px;text-align:center}}

.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px/1 var(--body);padding:13px 18px;border-radius:9px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--nile);color:var(--nile-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--nile);color:var(--nile)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}

.band{padding-block:52px}
.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.stack{display:grid;gap:18px}
.stack>*{min-width:0}
.hero{padding-block:60px 40px;display:grid;gap:22px}
.hero h1 em{font-style:normal;color:var(--nile)}
.search{display:flex;gap:8px;max-width:640px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;font:17px var(--body);padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;font:500 14px/1.3 var(--mono);color:var(--muted)}
.stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;font-size:16px}
:root[lang="ar"] .stats{font-family:var(--body)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{display:grid;gap:10px;align-content:start;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);min-width:0}
.pcard:hover{border-color:var(--nile)}
.pcard p{color:var(--muted);font-size:15.5px}
.route{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.route i{display:block;width:22px;height:4px;border-radius:2px;background:var(--nile-soft)}
.route i.done{background:var(--nile)}
.meta{font:400 13px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
:root[lang="ar"] .meta{font-family:var(--body);font-size:14px}
.cat{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--saffron)}
:root[lang="ar"] .cat{font-family:var(--body);font-size:13px;letter-spacing:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px/1 var(--body);padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--nile);border-color:var(--nile);color:var(--nile-ink)}
.chip .n{font-weight:400;opacity:.75;margin-inline-start:4px}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.catcard{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:16px 18px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:600;cursor:pointer;font:600 16px var(--body);text-align:start}
.catcard:hover{border-color:var(--nile)}
.catcard span{font:400 13px var(--mono);color:var(--muted)}

.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.offer{display:grid;gap:10px;align-content:start;padding:22px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line);min-width:0}
.offer p{color:var(--muted);font-size:15.5px}
.offer a{font-weight:600}

.path-head{display:grid;gap:14px;padding-block:44px 24px}
.progress{display:flex;align-items:center;gap:12px;font:500 14px var(--mono);color:var(--muted);flex-wrap:wrap}
:root[lang="ar"] .progress{font-family:var(--body)}
.meter{flex:0 0 180px;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--nile)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-bottom:64px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.stages{display:grid;list-style:none;margin:0;padding:0}
.stage{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:28px;position:relative}
.stage::before{content:"";position:absolute;inset-inline-start:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--mono);background:var(--surface);border:2px solid var(--nile);color:var(--nile)}
.stage.complete .num{background:var(--nile);color:var(--nile-ink)}
.stage-body{display:grid;gap:10px;min-width:0}
.stage-body>p{color:var(--muted)}
.side{display:grid;gap:14px;position:sticky;top:84px}
@media (max-width:900px){.side{position:static}}
.sponsor-slot{padding:18px;border:1px dashed var(--saffron);border-radius:var(--r);background:var(--saffron-soft);display:grid;gap:8px}
.sponsor-slot .lbl{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--saffron)}
:root[lang="ar"] .sponsor-slot .lbl{font-family:var(--body);font-size:13px;letter-spacing:0}
.sponsor-slot p{font-size:15px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.ov{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:8px;align-content:start;min-width:0}
.ov h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14.5px;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.lv{font:500 11px/1 var(--mono);letter-spacing:.05em;padding:5px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:middle;margin-inline-start:8px;white-space:nowrap}
:root[lang="ar"] .lv{font-family:var(--body);font-size:12px;letter-spacing:0}
.lv-zero{background:var(--saffron-soft);color:var(--saffron)}.lv-final{background:var(--nile);color:var(--nile-ink)}
.stage.final .num{border-color:var(--saffron);color:var(--saffron)}
.tracks{display:grid;gap:14px;padding-bottom:64px}
.track{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:12px}
.track>p{color:var(--muted)}
.next{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px}
.next a{font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.next a:hover{border-color:var(--nile)}
.box{padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:8px}
.box p{font-size:15px;color:var(--muted)}

.courses{display:grid;gap:8px}
.course{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.course input{width:20px;height:20px;margin-top:4px;accent-color:var(--nile)}
.course .t{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.course .t a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
.course .t a:hover{color:var(--nile)}
.course.done .t a{color:var(--muted);text-decoration:line-through}
.course .sub{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14.5px;color:var(--muted)}
.course .note,.course details.ev{grid-column:2;font-size:14.5px;color:var(--muted)}
.course.nobox{grid-template-columns:minmax(0,1fr)}
.course.nobox .note,.course.nobox details.ev{grid-column:1}
.pill{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border-radius:5px;white-space:nowrap}
:root[lang="ar"] .pill{font-family:var(--body);font-size:12px;letter-spacing:0}
.p-free{background:var(--ok-soft);color:var(--ok)}
.p-open{background:var(--nile-soft);color:var(--nile)}
.p-lvl{background:var(--sunk);color:var(--muted)}
details.ev summary{cursor:pointer;color:var(--nile);font-weight:600}
details.ev p{margin-top:6px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.filters input,.filters select{font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.filters input{flex:1 1 220px}
.filters select{flex:1 1 150px;width:0}
.count{font:500 14px var(--mono);color:var(--muted)}
:root[lang="ar"] .count{font-family:var(--body)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.points{display:grid;gap:14px;list-style:none;margin:0;padding:0}
.points li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.points li::before{content:"";width:10px;height:10px;margin-top:9px;border-radius:2px;background:var(--saffron);justify-self:center}
.points b{display:block}
.points span{color:var(--muted)}
.cta-card{display:grid;gap:12px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-content:start}
.cta-card p{color:var(--muted)}
.faq{display:grid;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin-top:8px;color:var(--muted)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tier{padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:8px;align-content:start}
.tier p{color:var(--muted);font-size:15px}
.note-box{padding:14px 16px;border-radius:8px;background:var(--saffron-soft);color:var(--ink);font-size:15.5px}
.prose{display:grid;gap:14px;max-width:72ch;padding-bottom:64px}
.prose h2{font-size:22px;margin-top:10px}
.prose ul,.prose ol{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.prose p,.prose li{color:var(--ink)}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:28px 44px;margin-top:20px}
footer .wrap{display:grid;gap:14px}
footer p{font-size:14.5px;color:var(--muted);max-width:80ch}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px}
footer nav a{font-weight:600;font-size:15px;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

/* ================= routing ================= */
function parse(){
  if(MODE==='path'){
    let p=decodeURIComponent(location.pathname);
    if(p.startsWith(BASE))p=p.slice(BASE.length);else p=p.replace(/^\//,'');
    p=p.replace(/index\.html$/,'').replace(/\/+$/,'');
    if(p==='ar'||p.startsWith('ar/')){LANG='ar';p=p.slice(3)}else LANG='en';
    return p;
  }
  try{const l=localStorage.getItem(LKEY);if(l==='ar'||l==='en')LANG=l}catch(e){}
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h||h==='home'||h==='view')return '';
  if(h.startsWith('path-'))return 'paths/'+h.slice(5);
  return h;
}
function href(route,lang){
  lang=lang||LANG;
  if(MODE==='path')return BASE+(lang==='ar'?'ar/':'')+(route?route+'/':'');
  if(!route)return '#home';
  return '#'+route.replace(/^paths\//,'path-');
}
const A=(route,attrs)=>`href="${href(route)}" data-nav="${route}"${attrs?' '+attrs:''}`;
function go(route,replace){
  if(MODE==='path'){history[replace?'replaceState':'pushState'](null,'',href(route));render()}
  else{const h=href(route);if(location.hash===h)render();else location.hash=h}
}

function costPill(c){return c.cost==='free'?`<span class="pill p-free">${t('free')}</span>`:`<span class="pill p-open">${t('open')}</span>`}
function fmtLabel(f){return LANG==='ar'&&FMT_AR[f]?FMT_AR[f]:f}
function evidence(c){
  const pe=c.provider_evidence, ch=c.check;
  let s=pe?`<p>${t('ev_provider',{claim:esc(pe.claim),url:esc(pe.url),date:fmtDate(D.verified_on)})}</p>`:`<p>${t('ev_open')}</p>`;
  s+=`<p>${t('ev_check',{v:esc(ch.verdict),d:ch.checked_at?', '+fmtDate(ch.checked_at):''})}</p>`;
  return `<details class="ev"><summary>${t('how_free')}</summary>${s}</details>`;
}
function courseCard(c,box){
  const done=!!progress[c.id];
  return `<div class="course${done?' done':''}${box?'':' nobox'}" data-id="${c.id}">
    ${box?`<input type="checkbox" id="cb-${c.id}-${box}" data-cid="${c.id}" ${done?'checked':''} aria-label="${esc(t('mark_done',{t:c.title}))}">`:''}
    <div><div class="t"><a href="${esc(c.url)}" target="_blank" rel="noopener" lang="en" dir="auto">${esc(c.title)}</a></div>
    <div class="sub"><span dir="auto">${esc(c.provider)}</span>${costPill(c)}<span class="pill p-lvl">${t('lv_'+c.level)}</span><span>${esc(fmtLabel(c.format))}</span></div></div>
    ${c.note&&LANG==='en'?`<p class="note">${esc(c.note)}</p>`:''}${evidence(c)}</div>`;
}
const pathIds=p=>[...new Set(p.stages.flatMap(s=>s.courses))];
function pathDone(p){const ids=pathIds(p);return [ids.filter(i=>progress[i]).length,ids.length]}

}

    <div class="filters" role="search">
      <label class="sr" for="fq">${t('f_search')}</label><input id="fq" type="search" placeholder="${esc(t('f_search'))}" autocomplete="off">
      <label class="sr" for="fpath">${t('f_path')}</label><select id="fpath"><option value="">${t('f_path')}</option>${D.paths.map(p=>`<option value="${p.id}">${esc(loc(p,'title'))}</option>`).join('')}</select>
      <label class="sr" for="flevel">${t('f_level')}</label><select id="flevel"><option value="">${t('f_level')}</option>${['Beginner','Intermediate','Advanced'].map(l=>`<option value="${l}">${t('lvl_'+l)}</option>`).join('')}</select>
      <label class="sr" for="fcost">${t('f_cost')}</label><select id="fcost"><option value="">${t('f_cost')}</option><option value="free">${t('f_free')}</option><option value="open">${t('f_open')}</option></select>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="courses" id="list"></div>
    <button class="btn btn-ghost" id="more" type="button" hidden>${t('show_more')}</button>
  </section>`;
function filterCourses(reset){
  if(reset)ui.limit=60;
  const v=id=>document.getElementById(id).value, q=v('fq').trim().toLowerCase(), path=v('fpath');
  const inPath=path?new Set(pathIds(pathById[path])):null;
  const list=D.courses.filter(c=>(!q||(c.title+' '+c.provider+' '+c.format).toLowerCase().includes(q))&&(!inPath||inPath.has(c.id))&&(!v('flevel')||c.level===v('flevel'))&&(!v('fcost')||c.cost===v('fcost')));
  document.getElementById('count').textContent=t('count',{n:num(list.length),t:num(D.courses.length)});
  document.getElementById('list').innerHTML=list.length?list.slice(0,ui.limit).map(c=>courseCard(c,'')).join(''):`<div class="empty">${t('no_match')}</div>`;
  document.getElementById('more').hidden=list.length<=ui.limit;
}
const ctaCard=(kind,h,p,btn)=>{const url=D.site.forms[kind];return `<div class="cta-card"><h2 style="font-size:24px">${h}</h2><p>${p}</p>${url?`<a class="btn btn-primary" href="${esc(url)}" target="_blank" rel="noopener">${btn} <span class="arr">→</span></a>`:`<div class="note-box">${t('form_soon')}</div>`}</div>`};
const points=keys=>`<ul class="points">${keys.map(k=>`<li><div><b>${t(k)}</b><span>${t(k+'s')}</span></div></li>`).join('')}</ul>`;
V['cohorts']=()=>`<section class="wrap path-head"><div class="eyebrow">${t('co_eyebrow')}</div><h1>${t('co_h1')}</h1><p class="lede">${t('co_lede')}</p></section>
  <section class="wrap split" style="padding-bottom:56px"><div class="stack">${points(['co_p1','co_p2','co_p3','co_p4','co_p5'])}
    <div class="faq">${[1,2,3].map(i=>`<details><summary>${t('co_q'+i)}</summary><p>${t('co_a'+i)}</p></details>`).join('')}</div></div>
    ${ctaCard('waitlist',t('co_form_h'),t('co_form_p'),t('co_form_btn'))}</section>`;
V['institutions']=()=>`<section class="wrap path-head"><div class="eyebrow">${t('in_eyebrow')}</div><h1>${t('in_h1')}</h1><p class="lede">${t('in_lede')}</p></section>
  <section class="wrap split" style="padding-bottom:56px"><div class="stack"><div class="tiers">${[1,2,3].map(i=>`<div class="tier"><h3>${t('in_t'+i)}</h3><p>${t('in_t'+i+'p')}</p></div>`).join('')}</div><p class="meta">${t('in_price')}</p></div>
    ${ctaCard('institution',t('in_form_h'),t('in_form_p'),t('in_form_btn'))}</section>`;
V['sponsor']=()=>`<section class="wrap path-head"><div class="eyebrow">${t('sp_eyebrow')}</div><h1>${t('sp_h1')}</h1><p class="lede">${t('sp_lede')}</p></section>
  <section class="wrap split" style="padding-bottom:56px"><div class="stack">${points(['sp_p1','sp_p2','sp_p3','sp_p4'])}<div class="box"><h3>${t('sp_open')}</h3><p>${t('sp_open_p',{n:num(D.paths.length)})}</p></div></div>
    ${ctaCard('sponsor',t('sp_form_h'),t('sp_form_p'),t('sp_form_btn'))}</section>`;
V['support']=()=>{const links=(D.site.donate||[]).filter(d=>d.url);
  return `<section class="wrap path-head"><div class="eyebrow">${t('su_eyebrow')}</div><h1>${t('su_h1')}</h1><p class="lede">${t('su_lede')}</p></section>
  <section class="wrap stack" style="padding-bottom:64px"><div class="tiers"><div class="tier"><h3>${t('su_t1')}</h3><p>${t('su_t1p')}</p></div><div class="tier"><h3>${t('su_t2')}</h3><p>${t('su_t2p')}</p></div></div>
  ${links.length?`<div class="row">${links.map(d=>`<a class="btn btn-primary" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label)}</a>`).join('')}</div>`:`<div class="note-box">${t('su_none')}</div>`}</section>`};
V['method']=()=>`<section class="wrap path-head"><div class="eyebrow">${t('me_eyebrow')}</div><h1>${t('me_h1')}</h1></section>
  <section class="wrap prose"><ol>${[1,2,3,4,5].map(i=>`<li>${t('me_'+i)}</li>`).join('')}</ol>
  <p class="meta">${t('me_stats',{n:num(D.courses.length),h:num(D.hidden.length),d:fmtDate(D.built_at)})}</p></section>`;
const legal=(kind,titleKey)=>()=>`<section class="wrap path-head"><div class="eyebrow">${t('updated',{d:fmtDate(D.site.legalUpdated)})}</div><h1>${t(titleKey)}</h1></section>
  <section class="wrap prose">${LEGAL[LANG][kind]}<p>${t('contact_line',{c:D.site.contactEmail?esc(D.site.contactEmail):t('contact_none')})}</p></section>`;
V['privacy']=legal('privacy','pv_title');V['terms']=legal('terms','tm_title');
const notFound=()=>`<section class="wrap path-head"><h1>${t('nf_h1')}</h1><p class="lede">${t('nf_p',{home:A(''),paths:A('paths')})}</p></section>`;
const lastChecked=()=>{const x=D.courses.map(c=>c.check.checked_at).filter(Boolean).sort();return x.length?x[x.length-1]:null};

/* ================= chrome ================= */
function chrome(route){
  const root=document.documentElement;root.lang=LANG;root.dir=LANG==='ar'?'rtl':'ltr';
  document.getElementById('skip').textContent=t('skip');
  document.getElementById('menuBtn').textContent=t('menu');
  const brand=document.querySelector('.brand');brand.setAttribute('href',href(''));brand.dataset.nav='';
  const sec=route.startsWith('paths')?'paths':route;
  const items=[['paths','nav_paths'],['courses','nav_courses'],['cohorts','nav_cohorts'],['institutions','nav_inst'],['sponsor','nav_sponsor'],['support','nav_support']];
  const other=t('lang_other_code');
  document.getElementById('nav').innerHTML=items.map(([r,k])=>`<a ${A(r)}${sec===r?' aria-current="page"':''}>${t(k)}</a>`).join('')+
    (MODE==='path'?`<a class="lang" href="${href(route,other)}" hreflang="${other}" lang="${other}" data-lang="${other}">${t('lang_other')}</a>`:`<button class="lang" type="button" lang="${other}" data-lang="${other}">${t('lang_other')}</button>`);
  document.getElementById('foot').innerHTML=`<nav aria-label="Footer"><a ${A('paths')}>${t('f_links_paths')}</a><a ${A('courses')}>${t('f_links_courses')}</a><a ${A('method')}>${t('f_links_method')}</a><a ${A('cohorts')}>${t('nav_cohorts')}</a><a ${A('institutions')}>${t('nav_inst')}</a><a ${A('sponsor')}>${t('nav_sponsor')}</a><a ${A('support')}>${t('nav_support')}</a><a ${A('privacy')}>${t('f_links_privacy')}</a><a ${A('terms')}>${t('f_links_terms')}</a></nav>
    <p>${t('f_disclaimer')}</p><p>${t('f_stamp',{n:num(D.courses.length),p:num(D.paths.length),d:fmtDate(lastChecked())})}</p>`;
}
function setMeta(route,found){
  let title,desc;const T2=t('titles'),DS=t('descs');
  if(route.startsWith('paths/')&&found){const p=pathById[route.slice(6)];const n=pathIds(p).length;
    title=`${loc(p,'title')} · Darb`;desc=t('page_desc_path',{t:loc(p,'title'),f:loc(p,'for'),n:num(n),s:num(p.stages.length)})}
  else{const k=found?(route||'home'):'nf';title=k==='home'?T2.home:`${T2[k]} · Darb`;desc=(DS[k]||'').replace('{p}',num(D.paths.length))}
  document.title=title;const m=document.querySelector('meta[name="description"]');if(m)m.setAttribute('content',desc);
}
let lastRoute=null;
function render(){
  const route=parse();
  let html;
  if(route.startsWith('paths/'))html=pathView(route.slice(6));
  else if(V[route])html=V[route]();
  const found=html!=null;
  if(!found)html=notFound();
  chrome(route);
  view.innerHTML=html;
  setMeta(route,found);
  document.getElementById('nav').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  if(route==='courses')filterCourses(true);
  if(route==='paths')drawPaths();
  if(lastRoute!==null&&lastRoute!==route){window.scrollTo(0,0);view.focus({preventScroll:true})}
  lastRoute=route;
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(e.target.id==='skip'){e.preventDefault();view.focus();return}
  const a=e.target.closest('a[data-nav]');
  if(a&&MODE==='path'&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&e.button===0){e.preventDefault();go(a.dataset.nav);return}
  const lb=e.target.closest('[data-lang]');
  if(lb&&MODE==='hash'){e.preventDefault();LANG=lb.dataset.lang;try{localStorage.setItem(LKEY,LANG)}catch(_){}render();return}
  const cat=e.target.closest('[data-cat]');
  if(cat){ui.catFilter=cat.dataset.cat;if(parse()!=='paths')go('paths');else drawPaths();return}
  if(e.target.id==='more'){ui.limit+=60;filterCourses(false);return}
  if(e.target.id==='resetPath'){const p=pathById[e.target.dataset.path];pathIds(p).forEach(i=>delete progress[i]);save();render()}
});
document.getElementById('menuBtn').addEventListener('click',e=>{const n=document.getElementById('nav');const o=n.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(o))});
view.addEventListener('submit',e=>{
  if(e.target.id!=='homeSearch')return;e.preventDefault();
  const q=document.getElementById('hq').value;go('courses');
  const i=document.getElementById('fq');if(i){i.value=q;filterCourses(true)}
});
view.addEventListener('input',e=>{
  if(e.target.id==='pq'){ui.pathQ=e.target.value;drawPaths()}
  if(e.target.id==='fq')filterCourses(true);
});
view.addEventListener('change',e=>{
  if(['fpath','flevel','fcost'].includes(e.target.id)){filterCourses(true);return}
  const cid=e.target.dataset&&e.target.dataset.cid;if(!cid)return;
  if(e.target.checked)progress[cid]=Date.now();else delete progress[cid];save();
  document.querySelectorAll(`.course[data-id="${cid}"]`).forEach(c=>{c.classList.toggle('done',e.target.checked);const b=c.querySelector('input');if(b)b.checked=e.target.checked});
  const r=parse();if(r.startsWith('paths/')){const p=pathById[r.slice(6)];const [d,n]=pathDone(p);
    document.getElementById('meter').style.width=(n?100*d/n:0)+'%';document.getElementById('ptext').textContent=t('progress_t',{d:num(d),t:num(n)});
    document.querySelectorAll('.stage').forEach((li,i)=>{const s=p.stages[i];li.classList.toggle('complete',s.courses.length>0&&s.courses.every(c=>progress[c]))})}
});
window.addEventListener(MODE==='path'?'popstate':'hashchange',render);

(async function(){
  try{D=await (await fetch((MODE==='path'?BASE:'')+'data/catalog.json')).json()}catch(e){parse();view.innerHTML=`<div class="wrap band"><p>${t('load_fail')}</p></div>`;return}
  D.courses.forEach(c=>byId[c.id]=c);D.paths.forEach(p=>pathById[p.id]=p);
  render();
})();
})();
</script>
